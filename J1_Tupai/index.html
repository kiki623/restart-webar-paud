<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RE-START | WebAR J1 Tupai</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#15291b;color:white;overflow:hidden}
#intro{position:fixed;inset:0;background:linear-gradient(145deg,#245a3b,#10251c);z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;box-sizing:border-box}
.panel{max-width:430px;text-align:center;background:#ffffff12;border:1px solid #ffffff30;border-radius:20px;padding:24px;box-shadow:0 15px 50px #0005}
h1{font-size:24px;margin:4px 0 9px}p{line-height:1.5;font-size:14px;color:#e8f5eb}
button{border:0;background:#f5c568;color:#193221;padding:13px 18px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;min-height:44px}
button:disabled{opacity:.55}
#ui{position:fixed;z-index:9;left:12px;right:12px;top:12px;display:none;pointer-events:none;text-align:center}
#status{display:inline-block;border-radius:12px;padding:11px 15px;background:#153829df;color:#fff;font-size:14px;max-width:90%}
#actions{position:fixed;bottom:20px;left:0;right:0;display:none;z-index:9;justify-content:center;gap:10px;pointer-events:none}
#actions button{pointer-events:auto;font-size:13px;padding:9px 13px;background:#f5d08a}
a-scene{position:absolute;inset:0}
</style>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const scene=document.querySelector('#arScene');
 const video=document.querySelector('#videoJ1');
 const target=document.querySelector('#tupaiTarget');
 const status=document.querySelector('#status');
 const audio=document.querySelector('#audio');
 const replay=document.querySelector('#replay');
 const start=document.querySelector('#start');
 const intro=document.querySelector('#intro');
 let tracking=false, soundOn=false;
 const setStatus=s=>status.textContent=s;
 const reset=()=>{video.pause();try{video.currentTime=0}catch(e){}};
 target.addEventListener('targetFound',()=>{
   tracking=true;video.muted=!soundOn;
   setStatus('Tupai J1 terdeteksi — animasi diputar');
   video.play().catch(()=>setStatus('Tupai dikenali. Ketuk Putar Ulang untuk memutar video.'));
 });
 target.addEventListener('targetLost',()=>{
   tracking=false;reset();setStatus('Arahkan kamera ke gambar Tupai J1');
 });
 replay.addEventListener('click',()=>{
   if(!tracking){setStatus('Arahkan kamera ke gambar Tupai J1 terlebih dahulu.');return;}
   video.currentTime=0;video.play().catch(()=>setStatus('Ketuk lagi untuk memulai video.'));
 });
 audio.addEventListener('click',()=>{
   soundOn=!soundOn;video.muted=!soundOn;
   audio.textContent=soundOn?'Matikan Suara':'Aktifkan Suara';
   if(tracking)video.play().catch(()=>{});
 });
 start.addEventListener('click',async()=>{
   start.disabled=true;start.textContent='Mengaktifkan kamera…';
   try{video.muted=true;await video.play();video.pause();video.currentTime=0}catch(e){}
   try{
     if(!scene.hasLoaded)await new Promise(resolve=>scene.addEventListener('loaded',resolve,{once:true}));
     await scene.systems['mindar-image-system'].start();
     intro.style.display='none';document.querySelector('#ui').style.display='block';document.querySelector('#actions').style.display='flex';
     setStatus('Arahkan kamera ke gambar Tupai J1');
   }catch(e){start.disabled=false;start.textContent='Coba Lagi';document.querySelector('#error').textContent='Gagal membuka kamera atau target. Pastikan HTTPS, izin kamera, dan targets.mind. '+(e?.message||e);}
 });
});
</script>
</head>
<body>
<div id="intro"><div class="panel">
<h1>Puti dan Rimbo Kaki Bukik</h1>
<p><strong>WebAR J1 — Tupai Berkejaran di Pagi Berembun.</strong> Ketuk mulai, izinkan kamera, lalu arahkan HP ke gambar Tupai yang dicetak datar.</p>
<button id="start">Mulai Scan AR</button>
<p>Narasi tetap dibacakan guru. Ketuk <strong>Aktifkan Suara</strong> untuk suara daun, langkah tupai, cit-cit, dan kicau burung.</p>
<p id="error" style="color:#ffdfb3" aria-live="polite"></p>
</div></div>
<div id="ui"><span id="status" aria-live="polite">Menyiapkan AR…</span></div>
<div id="actions"><button id="replay">Putar Ulang</button><button id="audio">Aktifkan Suara</button></div>
<a-scene id="arScene" mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1; uiScanning: yes; uiLoading: yes;" color-space="sRGB" renderer="colorManagement: true; antialias: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
 <a-assets timeout="30000">
  <video id="videoJ1" src="./J1_tupai.mp4" preload="auto" muted loop playsinline webkit-playsinline crossorigin="anonymous"></video>
 </a-assets>
 <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
 <a-entity id="tupaiTarget" mindar-image-target="targetIndex: 0">
  <a-plane width="1" height="1" position="0 0 0.01" material="shader: flat; src: #videoJ1; side: double"></a-plane>
 </a-entity>
</a-scene>
</body>
</html>
