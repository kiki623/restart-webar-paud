<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>RE-START — J2 Kelinci (Perbaikan Latar Kamera)</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    /* AR canvas transparan harus di depan video kamera, bukan menutupinya dengan warna hitam */
    a-scene#arScene {
      position: fixed !important; inset: 0 !important;
      display: block !important; width: 100vw !important; height: 100dvh !important;
      z-index: 1; background: transparent !important;
    }
    #arScene .a-canvas, #arScene canvas {
      background: transparent !important;
    }
    /* MindAR membuat video kamera sendiri. Jangan sembunyikan / beri display:none. */
    video.mindar-camera-feed {
      position: fixed !important; inset: 0 !important;
      width: 100vw !important; height: 100dvh !important;
      object-fit: cover !important; z-index: 0 !important;
      display: block !important; visibility: visible !important; opacity: 1 !important;
    }
    #videoAsset { position:absolute; width:2px; height:2px; left:-12px; top:-12px; opacity:0.01; pointer-events:none; }
    #status {
      position:fixed; top:calc(12px + env(safe-area-inset-top, 0px)); left:5%;
      width:90%; z-index:50; background:rgba(2,24,18,.82); color:white;
      border-radius:10px; padding:9px; text-align:center; font-size:12px;
    }
    #controls {
      position:fixed; z-index:50; bottom:calc(20px + env(safe-area-inset-bottom, 0px));
      display:flex; gap:7px; flex-wrap:wrap; left:7px; right:7px; justify-content:center;
    }
    button { border:0; border-radius:9px; background:#ffe3a6; color:#213129; padding:11px; font-size:12px; font-weight:700; }
    #fallback {
      display:none; position:fixed; z-index:80; inset:0;
      background:#061311; align-items:center; justify-content:center; flex-direction:column; gap:16px;
    }
    #fallbackVideo { width:100%; max-height:75dvh; object-fit:contain; }
  </style>
</head>
<body>
  <div id="status" aria-live="polite">Memulai kamera AR…</div>
  <video id="videoAsset" src="./J2_kelinci.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>

  <a-scene id="arScene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1; uiLoading: yes; uiScanning: yes; uiError: yes"
    color-space="sRGB" renderer="alpha: true; colorManagement: true; antialias: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-plane id="videoPlane" width="1" height="0.5625" position="0 0 0.02"
        visible="false" material="shader: flat; src: #videoAsset; side: double; transparent: false"></a-plane>
      <a-plane id="testPlane" width="0.8" height="0.45" position="0 0 0.03"
        visible="false" material="shader: flat; color: #20b3ed; side: double"></a-plane>
    </a-entity>
  </a-scene>

  <div id="controls">
    <button id="testBtn">Uji Bidang Biru</button>
    <button id="playBtn">▶ Video AR</button>
    <button id="soundBtn">Aktifkan Suara</button>
    <button id="fallbackBtn">Video Biasa</button>
  </div>
  <div id="fallback">
    <video id="fallbackVideo" src="./J2_kelinci.mp4" controls playsinline webkit-playsinline></video>
    <button id="closeBtn">Kembali ke Kamera AR</button>
  </div>

  <script>
  (() => {
    const scene = document.getElementById('arScene');
    const target = document.getElementById('target');
    const video = document.getElementById('videoAsset');
    const videoPlane = document.getElementById('videoPlane');
    const testPlane = document.getElementById('testPlane');
    const status = document.getElementById('status');
    let detected = false, testing = false;
    const say = msg => { status.textContent = msg; };

    function cameraLayers() {
      // MindAR menambahkan HTMLVideoElement kamera ke DOM.
      // Kenali hanya video kamera; jangan ubah file MP4 atau video fallback.
      const allVideos = Array.from(document.querySelectorAll('video'));
      const cameraVideos = allVideos.filter(v => v.id !== 'videoAsset' && v.id !== 'fallbackVideo');
      cameraVideos.forEach(v => {
        v.classList.add('mindar-camera-feed');
        // Pastikan video tidak terhalang posisi stacking/opacity bawaan.
        v.style.setProperty('visibility', 'visible', 'important');
        v.style.setProperty('opacity', '1', 'important');
        v.style.setProperty('display', 'block', 'important');
        v.style.setProperty('z-index', '0', 'important');
      });
      if (scene.renderer) {
        scene.renderer.setClearColor(0x000000, 0);
        scene.renderer.setClearAlpha(0);
        if (scene.canvas) {
          scene.canvas.style.setProperty('background', 'transparent', 'important');
        }
      }
      return cameraVideos.length;
    }
    // Menjalankan ulang pemasangan lapisan ketika MindAR menambah video kamera.
    const observer = new MutationObserver(() => cameraLayers());
    observer.observe(document.body, { childList: true, subtree: true });

    function updateAR() {
      videoPlane.setAttribute('visible', detected && !testing);
      testPlane.setAttribute('visible', detected && testing);
    }
    async function playAR() {
      testing = false;
      updateAR();
      try {
        if (video.readyState < 2) video.load();
        await video.play();
        say(detected ? 'J2 dikenali — video berjalan.' : 'Video siap. Arahkan kamera ke gambar J2.');
      } catch (error) {
        say('Putar video perlu sentuhan: tekan tombol ▶ Video AR.');
      }
    }
    scene.addEventListener('loaded', () => {
      cameraLayers();
      say('AR dimuat; izinkan kamera dan arahkan ke gambar kelinci.');
    });
    scene.addEventListener('arReady', () => {
      cameraLayers();
      say('Kamera AR siap. Arahkan ke target J2.');
    });
    scene.addEventListener('arError', () => say('Kamera AR gagal. Periksa izin kamera.'));
    target.addEventListener('targetFound', () => {
      detected = true;
      updateAR();
      playAR();
    });
    target.addEventListener('targetLost', () => {
      detected = false;
      updateAR();
      video.pause();
      say('Arahkan kamera ke gambar kelinci J2.');
    });
    video.addEventListener('loadedmetadata', () => {
      if (video.videoWidth && video.videoHeight) videoPlane.setAttribute('height', video.videoHeight / video.videoWidth);
    });
    document.getElementById('playBtn').addEventListener('click', playAR);
    document.getElementById('testBtn').addEventListener('click', () => {
      testing = !testing;
      updateAR();
      say(testing ? 'Bidang uji biru aktif. Kamera seharusnya tampak di belakangnya.' : 'Bidang uji mati. Video AR aktif.');
      if (!testing && detected) playAR();
    });
    const soundBtn = document.getElementById('soundBtn');
    soundBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      soundBtn.textContent = video.muted ? 'Aktifkan Suara' : 'Matikan Suara';
      if (detected) playAR();
    });
    const fallback = document.getElementById('fallback');
    const fallbackVideo = document.getElementById('fallbackVideo');
    document.getElementById('fallbackBtn').addEventListener('click', () => {
      video.pause();
      fallback.style.display = 'flex';
      fallbackVideo.currentTime = 0;
      fallbackVideo.play().catch(() => {});
    });
    document.getElementById('closeBtn').addEventListener('click', () => {
      fallbackVideo.pause();
      fallback.style.display = 'none';
      if (detected) playAR();
    });
    video.addEventListener('error', () => say('Video J2_kelinci.mp4 tidak ditemukan.'));
  })();
  </script>
</body>
</html>
