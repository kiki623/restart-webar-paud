<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>RE-START J2 | Diagnosis Kamera dan Video</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html, body {margin:0!important; padding:0!important; width:100%;height:100%;overflow:hidden;background:#000;color:white;font-family:system-ui,Arial,sans-serif}
/* Leave MindAR and A-Frame in their standard non-embedded full-screen mode. */
#diagnostic {position:fixed;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;z-index:9999;pointer-events:none;text-align:center}
#msg {background:rgba(10,26,25,.89);padding:9px 12px;border-radius:8px;font-size:12px;display:inline-block}
#buttons {position:fixed;z-index:9999;bottom:calc(12px + env(safe-area-inset-bottom));left:8px;right:8px;display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
button {border:0;border-radius:9px;background:#ffd985;color:#222;font-weight:700;font-size:13px;padding:12px}
#startOverlay{position:fixed;inset:0;z-index:10000;display:flex;justify-content:center;align-items:center;background:#063127;text-align:center;padding:25px}
#startOverlay article{max-width:380px}
#fallback {position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10001;gap:12px;padding:12px}
#fallback video{width:100%;max-height:75%;object-fit:contain}
</style>
</head>
<body>
<div id="startOverlay"><article><h2>J2 — Uji Kamera AR</h2><p>Versi diagnostik: ketika gambar kelinci terdeteksi, seharusnya muncul <b>bidang biru</b>. Jika bidang biru muncul, tekan <b>Video AR</b> untuk mencoba animasinya.</p><button id="start">Mulai Scan AR</button></article></div>
<div id="diagnostic"><span id="msg">Siap untuk menguji kamera J2.</span></div>
<div id="buttons"><button id="test">Tampilkan Bidang Biru</button><button id="video">▶ Video AR</button><button id="sound">🔊 Suara</button><button id="watch">Lihat Video Biasa</button></div>
<div id="fallback"><video id="normalVideo" src="./J2_kelinci.mp4" controls playsinline webkit-playsinline preload="metadata"></video><button id="back">Kembali ke AR</button></div>
<a-scene id="scene" mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1; uiLoading: yes; uiScanning: yes; uiError: yes" color-space="sRGB" renderer="colorManagement: true; antialias: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-assets><video id="clip" src="./J2_kelinci.mp4" playsinline webkit-playsinline crossorigin="anonymous" preload="auto" loop muted></video></a-assets>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex: 0">
<a-plane id="blue" width="1" height="0.75" position="0 0 0.03" material="color: #04b9ff; opacity: 0.9; side: double" visible="true"></a-plane>
<a-video id="arVideo" src="#clip" width="1" height="0.5625" position="0 0 0.04" material="side: double; shader: flat" visible="false"></a-video>
</a-entity>
</a-scene>
<script>
(()=>{
 const s=document.getElementById('scene'),tar=document.getElementById('target'),v=document.getElementById('clip'),blue=document.getElementById('blue'),ar=document.getElementById('arVideo'),msg=document.getElementById('msg');
 let found=false, started=false, mode='blue';
 const say=t=>{msg.textContent=t;};
 const setMode=m=>{mode=m;blue.setAttribute('visible',m==='blue');ar.setAttribute('visible',m==='video');};
 function sizes(){const c=s.canvas;return `Layar ${innerWidth}x${innerHeight}; Canvas ${c?Math.round(c.getBoundingClientRect().width)+'x'+Math.round(c.getBoundingClientRect().height):'belum ada'}`;}
 document.getElementById('start').onclick=async()=>{
  document.getElementById('startOverlay').style.display='none';
  try{await s.systems['mindar-image-system'].start();started=true;setMode('blue');say('Kamera aktif. '+sizes()+' — arahkan ke gambar kelinci.');}
  catch(e){say('Kamera gagal: '+e.message);}
 };
 tar.addEventListener('targetFound',()=>{found=true;setMode(mode);say('TARGET TERDETEKSI. '+(mode==='blue'?'Bidang biru seharusnya muncul.':'Video AR aktif.')+' '+sizes());if(mode==='video')v.play().catch(e=>say('Perlu ketuk tombol Video AR: '+e.message));});
 tar.addEventListener('targetLost',()=>{found=false;v.pause();say('Target hilang. Arahkan lagi. '+sizes());});
 document.getElementById('test').onclick=()=>{v.pause();setMode('blue');say('Mode bidang biru. '+(found?'Target terdeteksi.':'Arahkan ke gambar kelinci.'));};
 document.getElementById('video').onclick=async()=>{setMode('video');try{await v.play();say((found?'Video AR diputar. ':'Arahkan kamera ke target. ')+sizes());}catch(e){say('Video dibatasi: '+e.message);}};
 document.getElementById('sound').onclick=async()=>{v.muted=!v.muted;document.getElementById('sound').textContent=v.muted?'🔊 Suara':'🔇 Matikan';try{await v.play()}catch(e){say('Tekan Video AR untuk memutar.')}};
 document.getElementById('watch').onclick=async()=>{v.pause();document.getElementById('fallback').style.display='flex';const n=document.getElementById('normalVideo');try{await n.play()}catch(e){}};
 document.getElementById('back').onclick=()=>{const n=document.getElementById('normalVideo');n.pause();document.getElementById('fallback').style.display='none';};
 v.onerror=()=>say('File video gagal dimuat. Pastikan nama J2_kelinci.mp4.');
})();
</script></body></html>
