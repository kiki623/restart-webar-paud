<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RE-START — J2 Kelinci</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
*{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07150f;font-family:system-ui,Arial,sans-serif}
a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;z-index:1;background:transparent!important}
.a-canvas{background:transparent!important}
#hint{position:fixed;z-index:20;top:calc(10px + env(safe-area-inset-top,0px));left:5%;width:90%;border-radius:12px;background:rgba(3,25,18,.84);color:#fff;padding:11px 12px;text-align:center;font-size:13px}
#movieLayer{display:none;position:fixed;inset:0;z-index:100;background:#000;align-items:center;justify-content:center;flex-direction:column}
#movieLayer.active{display:flex}
#movie{width:100vw;height:100dvh;object-fit:contain;background:#000}
#buttons{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:0;right:0;z-index:110;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 12px}
button{border:0;border-radius:12px;background:#ffe0a0;color:#18352b;font-weight:700;font-size:13px;padding:12px 14px;cursor:pointer}
#replay{display:none}
</style>
</head>
<body>
<div id="hint" role="status">Izinkan kamera, kemudian arahkan ke gambar kelinci J2.</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1; uiLoading: yes; uiScanning: yes; uiError: yes"
 renderer="alpha: true; antialias: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
 <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
 <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>
<div id="movieLayer" aria-label="Video J2 Kelinci">
 <video id="movie" src="./J2_kelinci.mp4" loop muted playsinline webkit-playsinline preload="auto"></video>
 <div id="buttons">
  <button type="button" id="play">▶ Putar Video</button>
  <button type="button" id="sound">🔊 Aktifkan Suara</button>
  <button type="button" id="again">↻ Ulangi</button>
  <button type="button" id="back">⌕ Scan Lagi</button>
 </div>
</div>
<script>
(()=>{
const target=document.getElementById('target');
const movie=document.getElementById('movie');
const layer=document.getElementById('movieLayer');
const hint=document.getElementById('hint');
const play=document.getElementById('play');
const sound=document.getElementById('sound');
const back=document.getElementById('back');
const again=document.getElementById('again');
let viewing=false, armed=true;
async function showVideo(){
 if(viewing||!armed)return;
 viewing=true;armed=false;
 layer.classList.add('active');
 movie.currentTime=0;
 movie.muted=true;
 sound.textContent='🔊 Aktifkan Suara';
 try{await movie.play();play.style.display='none'}
 catch(e){play.style.display='inline-block';hint.textContent='Tekan Putar Video untuk memulai.'}
}
target.addEventListener('targetFound',()=>{if(!viewing&&armed)showVideo()});
target.addEventListener('targetLost',()=>{if(!viewing)armed=true});
play.addEventListener('click',async()=>{try{await movie.play();play.style.display='none'}catch(e){play.textContent='Ketuk lagi untuk memutar'}});
sound.addEventListener('click',async()=>{movie.muted=!movie.muted;sound.textContent=movie.muted?'🔊 Aktifkan Suara':'🔇 Matikan Suara';try{await movie.play();play.style.display='none'}catch(e){play.style.display='inline-block'}});
again.addEventListener('click',async()=>{movie.currentTime=0;try{await movie.play();play.style.display='none'}catch(e){play.style.display='inline-block'}});
back.addEventListener('click',()=>{movie.pause();movie.currentTime=0;layer.classList.remove('active');viewing=false;armed=true;hint.textContent='Arahkan kamera ke gambar kelinci J2.'});
movie.addEventListener('error',()=>{play.style.display='inline-block';play.textContent='Video gagal dimuat';hint.textContent='Periksa nama file J2_kelinci.mp4'});
})();
</script>
</body>
</html>
