<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>RE-START | J2 Kelinci — WebAR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#10291b; font-family:system-ui,-apple-system,sans-serif; }
    #status { position:fixed; z-index:30; top:calc(12px + env(safe-area-inset-top, 0px)); left:5%; width:90%; border-radius:10px; background:rgba(5,35,23,.88); color:#fff; text-align:center; padding:10px; font-size:13px; line-height:1.4; box-sizing:border-box; }
    #controls { position:fixed; z-index:30; bottom:calc(18px + env(safe-area-inset-bottom,0px)); left:0; right:0; display:flex; flex-wrap:wrap; justify-content:center; gap:8px; padding:0 10px; }
    button { border:0; border-radius:10px; color:#19251d; background:#ffdfa0; font-size:13px; font-weight:700; padding:12px; }
    /* Do not override MindAR's camera-video positioning or its canvas dimensions. */
    #rabbitVideo { position:fixed; width:2px; height:2px; opacity:0.01; left:-10px; top:-10px; pointer-events:none; }
    #fallback { display:none; position:fixed; z-index:50; inset:0; background:#0a1612; align-items:center; justify-content:center; flex-direction:column; gap:12px; }
    #fallback video { display:block; width:100%; max-height:75vh; object-fit:contain; }
    #fallbackClose { margin-bottom:20px; }
  </style>
</head>
<body>
  <div id="status" role="status" aria-live="polite">Menyiapkan AR… izinkan akses kamera ketika diminta.</div>
  <div id="controls">
    <button id="playBtn">▶ Putar Video AR</button>
    <button id="soundBtn">🔊 Aktifkan Suara</button>
    <button id="testBtn">🟦 Uji Bidang</button>
    <button id="fallbackBtn">Lihat Video Biasa</button>
  </div>
  <video id="rabbitVideo" src="./J2_kelinci.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
  <a-scene id="arScene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1; uiLoading: yes; uiScanning: yes; uiError: yes"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets timeout="15000"></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="rabbitTarget" mindar-image-target="targetIndex: 0">
      <a-plane id="videoPlane" position="0 0 0.015" width="1" height="0.5625" visible="false" material="shader: flat; src: #rabbitVideo; side: double; transparent: false"></a-plane>
      <a-plane id="testPlane" position="0 0 0.025" width="0.8" height="0.45" color="#27b5ff" visible="false" material="shader: flat; side: double"></a-plane>
    </a-entity>
  </a-scene>
  <div id="fallback"><video id="fallbackVideo" src="./J2_kelinci.mp4" controls playsinline webkit-playsinline></video><button id="fallbackClose">Kembali ke AR</button></div>
  <script>
  (function () {
    const scene = document.getElementById('arScene');
    const target = document.getElementById('rabbitTarget');
    const video = document.getElementById('rabbitVideo');
    const plane = document.getElementById('videoPlane');
    const blue = document.getElementById('testPlane');
    const status = document.getElementById('status');
    const soundBtn = document.getElementById('soundBtn');
    const fallback = document.getElementById('fallback');
    const fbVideo = document.getElementById('fallbackVideo');
    let found = false, testMode = false;
    const say = (text) => { status.textContent = text; };
    const updatePlane = () => {
      plane.setAttribute('visible', found && !testMode);
      blue.setAttribute('visible', found && testMode);
    };
    async function playVideo() {
      try {
        if (video.readyState < 2) video.load();
        await video.play();
        updatePlane();
        say(found ? 'Kelinci dikenali — video AR diputar.' : 'Video siap; arahkan kamera ke gambar kelinci.');
      } catch (e) {
        say('Pemutaran video diblokir. Ketuk Putar Video AR setelah gambar dikenali.');
        console.error('Video playback:', e);
      }
    }
    // MindAR starts automatically AFTER scene initialization. Do not call scene.systems.start() here.
    scene.addEventListener('loaded', () => say('AR dimuat. Izinkan kamera dan arahkan ke gambar kelinci.'));
    scene.addEventListener('arReady', () => say('Kamera siap. Arahkan ke gambar kelinci J2.'));
    scene.addEventListener('arError', () => say('Gagal membuka kamera. Periksa izin Safari dan HTTPS.'));
    target.addEventListener('targetFound', () => { found = true; updatePlane(); playVideo(); });
    target.addEventListener('targetLost', () => { found = false; updatePlane(); video.pause(); say('Arahkan kamera kembali ke gambar kelinci J2.'); });
    document.getElementById('playBtn').addEventListener('click', () => { testMode = false; updatePlane(); playVideo(); });
    document.getElementById('testBtn').addEventListener('click', () => {
      testMode = !testMode;
      updatePlane();
      say(testMode ? 'Mode uji: jika target dikenali, bidang BIRU harus terlihat.' : 'Mode video AR aktif.');
      if (!testMode && found) playVideo();
    });
    soundBtn.addEventListener('click', async () => {
      video.muted = !video.muted;
      soundBtn.textContent = video.muted ? '🔊 Aktifkan Suara' : '🔇 Matikan Suara';
      if (found) await playVideo();
    });
    video.addEventListener('loadedmetadata', () => {
      if (video.videoWidth > 0 && video.videoHeight > 0)
        plane.setAttribute('height', video.videoHeight / video.videoWidth);
    });
    video.addEventListener('error', () => say('Video tidak ditemukan. Pastikan file J2_kelinci.mp4 ada di folder yang sama.'));
    document.getElementById('fallbackBtn').addEventListener('click', () => {
      video.pause(); fallback.style.display = 'flex';
      fbVideo.currentTime = 0; fbVideo.play().catch(() => {});
    });
    document.getElementById('fallbackClose').addEventListener('click', () => {
      fbVideo.pause(); fallback.style.display = 'none';
      if (found) playVideo();
    });
  })();
  </script>
</body>
</html>
